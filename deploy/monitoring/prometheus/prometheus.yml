global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: rivertrail
    metrics_path: /metrics
    static_configs:
      - targets: ["app:3000"]
        labels:
          environment: production

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
