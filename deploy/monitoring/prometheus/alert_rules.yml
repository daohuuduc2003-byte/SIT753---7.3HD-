groups:
  - name: rivertrail
    rules:
      - alert: RiverTrailDown
        expr: up{job="rivertrail"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "River Trail production app is down"
          description: "Prometheus has not been able to scrape {{ $labels.instance }} for 30 seconds."

      - alert: RiverTrailHighErrorRate
        expr: |
          sum(rate(flask_http_request_total{job="rivertrail",status=~"5.."}[2m]))
            / clamp_min(sum(rate(flask_http_request_total{job="rivertrail"}[2m])), 1e-9) > 0.05
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "More than 5% of River Trail requests are failing"
          description: "The 5xx error rate has been above 5% for 1 minute."

      - alert: RiverTrailSlowResponses
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(flask_http_request_duration_seconds_bucket{job="rivertrail"}[5m]))) > 0.5
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "River Trail responses are slow"
          description: "95th percentile response time has been above 0.5 seconds for 2 minutes."
